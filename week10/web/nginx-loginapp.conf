# =====================================================================
# Web Tier (Presentation Tier) : Nginx
#   - 호스트 OS 브라우저가 접속하는 유일한 계층 (0.0.0.0:80 으로 공개)
#   - /static/* 정적 파일은 Nginx 가 직접 응답 (WAS 를 거치지 않음)
#   - 나머지 요청은 WAS Tier(Gunicorn, 127.0.0.1:8000)로 리버스 프록시
#
# 설치 위치 (deploy/setup.sh 가 자동 복사)
#   Ubuntu : /etc/nginx/sites-available/loginapp.conf  (+ sites-enabled 심볼릭 링크)
#   Rocky  : /etc/nginx/conf.d/loginapp.conf
# =====================================================================

# 로그인 무차별 대입(brute-force) 완화 : 접속 IP당 초당 1회(순간 30회까지) 허용, 초과 시 429
limit_req_zone $binary_remote_addr zone=loginapp_login:10m rate=60r/m;

upstream loginapp_was {
    server 127.0.0.1:8000;          # WAS Tier (Gunicorn + Flask)
    keepalive 16;
}

server {
    listen 80 default_server;
    server_name _;

    access_log /var/log/nginx/loginapp_access.log;
    error_log  /var/log/nginx/loginapp_error.log;

    server_tokens off;              # 응답 헤더에 Nginx 버전 숨김
    client_max_body_size 1m;

    # 보안 헤더
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    # WAS 로 넘길 공통 헤더 : 실제 접속자 IP, 프로토콜, 웹 서버 정보
    proxy_http_version 1.1;
    proxy_set_header Connection        "";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Web-Tier        "nginx/$nginx_version";
    proxy_connect_timeout 3s;
    proxy_read_timeout    30s;

    # (1) 정적 파일 : Web Tier 가 직접 응답
    location /static/ {
        alias /var/www/loginapp/static/;
        expires 1h;
        access_log off;
    }

    # (2) 로그인 : 요청 수를 제한한 뒤 WAS 로 전달
    location = /login {
        limit_req zone=loginapp_login burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://loginapp_was;
    }

    # (3) 그 밖의 동적 요청 : WAS 로 전달
    location / {
        proxy_pass http://loginapp_was;
    }

    # WAS 가 꺼져 있으면(502/503/504) Nginx 가 직접 안내 페이지를 응답
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /var/www/loginapp;
        internal;
    }
}
