{% extends "base.html" %}
{% block title %}로그인 · 3-Tier 로그인 서비스{% endblock %}
{% block content %}
<section class="card">
  <h1>로그인</h1>
  <p class="sub">아이디와 비밀번호를 입력하세요.</p>
  {% include "_flashes.html" %}
  <form method="post" action="/login" class="form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="username">아이디</label>
    <input id="username" name="username" type="text" value="{{ username or '' }}"
           autocomplete="username" maxlength="20" required autofocus>
    <label for="password">비밀번호</label>
    <input id="password" name="password" type="password"
           autocomplete="current-password" maxlength="64" required>
    <button type="submit" class="btn">로그인</button>
  </form>
  <p class="switch">계정이 없으신가요? <a href="/signup">회원가입</a></p>
</section>
{% endblock %}
